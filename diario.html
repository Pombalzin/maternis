<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maternis - Diário da Gestação</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- SDK DO SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Arial, sans-serif;
        }

        body {
            background: #fff7fb;
            color: #444;
        }

        .container-diario {
            max-width: 820px;
            margin: auto;
            padding: 40px 20px 60px 20px;
        }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #d85b8b;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 25px;
            transition: .2s;
        }

        .btn-voltar:hover {
            color: #b94370;
            transform: translateX(-3px);
        }

        .titulo {
            text-align: center;
            margin-bottom: 30px;
        }

        .titulo h1 {
            color: #d85b8b;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .titulo p {
            color: #666;
            font-size: 15px;
        }

        .card-editor {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
            margin-bottom: 35px;
        }

        textarea {
            width: 100%;
            height: 180px;
            border: 2px solid #f3bfd5;
            border-radius: 15px;
            padding: 16px;
            resize: vertical;
            outline: none;
            font-size: 15px;
            line-height: 1.6;
            transition: .3s;
        }

        textarea:focus {
            border-color: #d85b8b;
            box-shadow: 0 0 0 3px rgba(216, 91, 139, 0.15);
        }

        .botoes {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-maternis {
            background: #d85b8b;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: .3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-maternis:hover {
            background: #b94370;
            color: white;
        }

        .btn-maternis:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-limpar {
            background: #f0f0f0;
            color: #666;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: .3s;
        }

        .btn-limpar:hover {
            background: #e2e2e2;
            color: #333;
        }

        .status {
            font-size: 14px;
            font-weight: 600;
            margin-top: 15px;
            text-align: right;
        }

        /* Seção de Busca e Filtro por Data */
        .card-busca {
            background: #fff0f5;
            padding: 18px 24px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid #f2c2d6;
        }

        .card-busca label {
            font-size: 13px;
            font-weight: 600;
            color: #a83d69;
            margin-bottom: 5px;
        }

        .historico-titulo {
            color: #a83d69;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item-relato {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .05);
            margin-bottom: 15px;
            border-left: 5px solid #d85b8b;
            position: relative;
        }

        .cabecalho-relato {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            color: #888;
        }

        .data-hora {
            font-weight: 600;
            color: #a83d69;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-excluir-relato {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            transition: .2s;
        }

        .btn-excluir-relato:hover {
            color: #c0392b;
            transform: scale(1.1);
        }

        .texto-relato {
            color: #555;
            line-height: 1.6;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <div class="container-diario">

        <a href="menu.html" class="btn-voltar">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao menu
        </a>

        <div class="titulo">
            <h1>📖 Diário da Gestação</h1>
            <p>Registre sentimentos, sintomas, emoções e momentos especiais durante sua jornada.</p>
        </div>

        <!-- Formulário de Nova Anotação -->
        <div class="card-editor">
            <textarea id="nota" placeholder="Como você e seu bebê estão se sentindo hoje? Escreva aqui..."></textarea>

            <div class="botoes">
                <button class="btn-limpar" onclick="limparCampoTexto()">
                    <i class="bi bi-eraser"></i> Limpar campo
                </button>
                <button class="btn-maternis" id="btnSalvarNota" onclick="salvarNotaSupabase()">
                    <i class="bi bi-floppy"></i> Salvar no diário
                </button>
            </div>

            <div class="status" id="status"></div>
        </div>

        <!-- Barra de Busca: Data e Palavra-chave -->
        <div class="card-busca">
            <div class="row g-2 align-items-end">
                <div class="col-md-5">
                    <label for="filtroData"><i class="bi bi-calendar-event me-1"></i> Filtrar por data:</label>
                    <input type="date" id="filtroData" class="form-control rounded-3" onchange="filtrarRelatos()">
                </div>
                <div class="col-md-5">
                    <label for="filtroTexto"><i class="bi bi-search me-1"></i> Pesquisar palavra-chave:</label>
                    <input type="text" id="filtroTexto" class="form-control rounded-3" placeholder="Ex: ultrassom, enjoo..." oninput="filtrarRelatos()">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-secondary w-100 rounded-3" onclick="limparFiltros()" title="Mostrar todos">
                        <i class="bi bi-arrow-counterclockwise"></i> Todos
                    </button>
                </div>
            </div>
        </div>

        <h3 class="historico-titulo">
            <i class="bi bi-clock-history"></i> Memórias Registradas
        </h3>

        <!-- Feed com os Relatos -->
        <div id="listaRelatos">
            <div class="text-center text-muted py-4 small">Carregando relatos...</div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://llktarpnobeigwgxfwwz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_OKqhjXKeDyuon0S05JJX-g_zvIl-Kk1";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let usuarioAtual = null;
        let todosRelatos = []; // Guarda a lista completa em cache para pesquisa instantânea

        function escaparHTML(valor) {
            return String(valor).replace(/[&<>"']/g, caractere => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[caractere]);
        }

        function formatarDataHoraBR(isoString) {
            const data = new Date(isoString);
            return data.toLocaleString("pt-BR", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        // Converte o timestamp para o formato AAAA-MM-DD local para comparar com o input date
        function extrairDataLocal(isoString) {
            const data = new Date(isoString);
            const ano = data.getFullYear();
            const mes = String(data.getMonth() + 1).padStart(2, "0");
            const dia = String(data.getDate()).padStart(2, "0");
            return `${ano}-${mes}-${dia}`;
        }

        async function inicializar() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = "index.html";
                return;
            }
            usuarioAtual = session.user;
            await carregarRelatos();
        }

        async function carregarRelatos() {
            const lista = document.getElementById("listaRelatos");

            const { data, error } = await supabaseClient
                .from('diario_gestacao')
                .select('*')
                .eq('user_id', usuarioAtual.id)
                .order('created_at', { ascending: false });

            if (error) {
                lista.innerHTML = `<div class="text-center text-danger py-4">Erro ao carregar: ${error.message}</div>`;
                return;
            }

            todosRelatos = data || [];
            filtrarRelatos();
        }

        function renderizarRelatos(relatosParaExibir) {
            const lista = document.getElementById("listaRelatos");
            lista.innerHTML = "";

            if (relatosParaExibir.length === 0) {
                lista.innerHTML = '<div class="text-center text-muted py-4">Nenhuma memória encontrada com os filtros informados. ✨</div>';
                return;
            }

            relatosParaExibir.forEach(item => {
                const el = document.createElement("div");
                el.className = "item-relato";
                el.innerHTML = `
                    <div class="cabecalho-relato">
                        <span class="data-hora">
                            <i class="bi bi-calendar-heart"></i> ${formatarDataHoraBR(item.created_at)}
                        </span>
                        <button class="btn-excluir-relato" onclick="excluirRelato('${item.id}')" title="Excluir relato">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                    <div class="texto-relato">${escaparHTML(item.texto)}</div>
                `;
                lista.appendChild(el);
            });
        }

        function filtrarRelatos() {
            const dataEscolhida = document.getElementById("filtroData").value;
            const termoTexto = document.getElementById("filtroTexto").value.toLowerCase().trim();

            const filtrados = todosRelatos.filter(relato => {
                const coincideData = !dataEscolhida || extrairDataLocal(relato.created_at) === dataEscolhida;
                const coincideTexto = !termoTexto || relato.texto.toLowerCase().includes(termoTexto);
                return coincideData && coincideTexto;
            });

            renderizarRelatos(filtrados);
        }

        function limparFiltros() {
            document.getElementById("filtroData").value = "";
            document.getElementById("filtroTexto").value = "";
            renderizarRelatos(todosRelatos);
        }

        async function salvarNotaSupabase() {
            const textarea = document.getElementById("nota");
            const texto = textarea.value.trim();
            const status = document.getElementById("status");
            const btn = document.getElementById("btnSalvarNota");

            if (!texto) {
                alert("Por favor, escreva uma anotação antes de salvar.");
                return;
            }

            btn.disabled = true;
            status.style.color = "#a83d69";
            status.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvando no diário...';

            const { error } = await supabaseClient
                .from('diario_gestacao')
                .insert([{
                    user_id: usuarioAtual.id,
                    texto: texto
                }]);

            btn.disabled = false;

            if (error) {
                status.style.color = "red";
                status.innerText = "❌ Erro ao salvar: " + error.message;
            } else {
                status.style.color = "green";
                status.innerText = "✅ Relato guardado com sucesso!";
                textarea.value = "";
                await carregarRelatos();
            }

            setTimeout(() => {
                status.innerText = "";
            }, 3500);
        }

        function limparCampoTexto() {
            const textarea = document.getElementById("nota");
            if (textarea.value.trim() !== "") {
                if (confirm("Deseja apagar o texto digitado na caixa?")) {
                    textarea.value = "";
                }
            }
        }

        async function excluirRelato(id) {
            if (!confirm("Tem certeza que deseja apagar esta anotação da sua história?")) return;

            const { error } = await supabaseClient
                .from('diario_gestacao')
                .delete()
                .eq('id', id);

            if (error) {
                alert("Erro ao excluir: " + error.message);
            } else {
                await carregarRelatos();
            }
        }

        window.onload = inicializar;
    </script>

</body>
</html>
